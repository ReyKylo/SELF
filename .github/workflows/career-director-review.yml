name: Career Director Review QA
on:
  pull_request:
    paths:
      - 'app.js'
      - 'career.js'
      - 'career-learning.css'
      - 'career-director-review.js'
      - 'career-learning.js'
      - 'content/career-director-review/**'
      - 'tests/career-director-review.test.cjs'
      - 'tests/career-director-review.browser.cjs'
      - 'tests/browser_director_full_app.cjs'
      - 'tests/browser_career_learning.cjs'
      - 'tests/browser_worksample.cjs'
      - 'tests/browser_rooms.cjs'
      - 'tests/browser_today.cjs'
      - 'tests/browser_hunt.cjs'
      - 'tests/browser_outreach.cjs'
      - 'outreach.js'
      - 'outreach.css'
      - 'tests/browser_lesson_loop.cjs'
      - 'career-grid.js'
      - 'career-visuals.js'
      - 'career-review.js'
      - 'career-lesson-loop.js'
      - 'career-lesson-loop.css'
      - 'tests/browser_work_tools.cjs'
      - 'data-export.js'
      - 'work-tools.js'
      - 'work-tools.css'
      - 'content/career-lessons-v2.json'
      - 'career-learning.css'
      - 'rooms.js'
      - 'rooms.css'
      - 'motion.js'
      - 'motion.css'
      - 'self-dnd.js'
      - 'today.js'
      - 'palette.js'
      - 'capture-parse.js'
      - 'tests/browser_palette.cjs'
      - 'career-phase2.js'
      - 'tests/xlsx_fixture.cjs'
      - 'career-worksample.js'
      - 'career-workbook-check.js'
      - 'content/work-samples/**'
      - 'content/career-learning.json'
      - 'tests/browser_learning_fixture.cjs'
      - 'index.html'
      - 'tools/build_cloudflare.py'
      - '.github/workflows/career-director-review.yml'
  workflow_dispatch:
jobs:
  director-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check career-director-review.js
          node --check career-learning.js
      - name: Director Review contract
        run: node tests/career-director-review.test.cjs
      - name: Existing PE VC Consulting source regression
        run: |
          node tests/cases/pe/check-case.cjs
          node tests/cases/vc/check-case.cjs
          node tests/cases/consulting/check-case.cjs
      - name: Cloudflare static build
        run: python3 tools/build_cloudflare.py
  director-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Director module Chromium interaction tests
        run: node tests/career-director-review.browser.cjs
      - name: Real SELF shell synthetic-login and mobile Chromium tests
        run: node tests/browser_director_full_app.cjs
      - name: Career Prep evidence, Task and focus Chromium tests
        run: node tests/browser_career_learning.cjs
      - name: Work Sample Chromium tests in the real SELF shell
        run: node tests/browser_worksample.cjs
      - name: Rooms shell and drag-and-drop Chromium tests
        run: node tests/browser_rooms.cjs
      - name: Today room Chromium tests
        run: node tests/browser_today.cjs
      - name: Hunt and Study rooms Chromium tests
        run: node tests/browser_hunt.cjs
      - name: Command palette Chromium tests
        run: node tests/browser_palette.cjs
      - name: Outreach board Chromium tests
        run: node tests/browser_outreach.cjs
      - name: Lesson Loop v2 and Daily Drill Chromium tests
        run: node tests/browser_lesson_loop.cjs
      - name: Work tools and Export Chromium tests
        run: node tests/browser_work_tools.cjs
