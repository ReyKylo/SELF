name: SELF combined Investment and Cobalt compatibility
on:
  push:
    branches: [integration/self-investment-cobalt-20261012]
  pull_request:
    paths: ['tools/**', '.github/workflows/integration-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_PATH: ${{ github.workspace }}/.review-runtime/node_modules
      SELF_REVIEW_URL: http://127.0.0.1:4173
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical build once with all legacy and investment checks
        run: |
          python3 tools/build_cloudflare.py
          mkdir -p artifacts/integration
          sha256sum dist/index.html > artifacts/integration/canonical-dist.sha256
          printf '%s\n' "$GITHUB_SHA" > artifacts/integration/source-sha.txt
      - name: Install shared independent browser runtime
        run: |
          npm install --prefix .review-runtime --no-save --no-package-lock playwright@1.62.1 @playwright/test@1.62.1
          .review-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve the same canonical output for Council reviews
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/self-integration-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ -o /dev/null && break; sleep 1; done
      - name: Original investment browser checks on canonical output
        if: always()
        run: node tools/qa_investment_browser_v1.cjs
      - name: Independent legacy Looker A
        if: always()
        run: node tools/reviews/looker_a.cjs
      - name: Independent legacy Looker B
        if: always()
        run: node tools/reviews/looker_b.cjs
      - name: Original eight legacy workflow groups
        if: always()
        run: node tools/reviews/qa_b.cjs
      - name: Independent combined-build Looker A
        if: always()
        run: node tools/reviews/looker_a_integration.cjs
      - name: Independent combined-build Looker B
        if: always()
        run: node tools/reviews/looker_b_integration.cjs
      - name: Combined output contract QA
        if: always()
        run: node tools/qa_integration_contract.cjs
      - name: Gate actual legacy reports and unchanged canonical bytes
        if: always()
        run: |
          node tools/reviews/gate.cjs
          node tools/reviews/integration_gate.cjs
          sha256sum -c artifacts/integration/canonical-dist.sha256
      - name: Preserve every independent report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-combined-compatibility-evidence
          path: artifacts/
          retention-days: 14
