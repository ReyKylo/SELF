name: SELF quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    name: Static app and Concept C smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to diff specialist PR files against base for ownership gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check boards.js
          node --check canvas-v3.js
          node --check career.js
          node --check career-phase2.js
          node --check career-phase3.js
          node --check career-learning.js
      - name: Phase 1 render smoke
        run: node tests/smoke_render.cjs
      - name: Phase 1 API smoke
        run: node tests/smoke_api.cjs
      - name: Career Phase 1 integration and ownership regression
        run: node tests/smoke_career_phase1.cjs
      - name: Career Phase 2 operations and shared Tasks regression
        run: node tests/smoke_career_phase2.cjs
      - name: Career Phase 3 sourced Radar regression
        run: node tests/smoke_career_phase3.cjs
      - name: Career Prep content and canonical Task regression
        run: node tests/smoke_career_learning.cjs
      - name: Career Prep real XLSX asset verification
        run: node tests/smoke_career_starter_assets.cjs
      - name: Portfolio workbench and professional PDF/PPTX deliverable tests
        run: node tests/smoke_career_portfolio.cjs
      - name: Career Prep Phase 1 teaching quality blueprint and competency contract
        run: node tests/smoke_career_prep_blueprint.cjs
      - name: GptChatMaximize parallel workstream safety contract
        run: node tests/smoke_gpt_chat_maximize.cjs
      - name: GptChatMaximize worker PR path isolation
        run: |
          node tools/check_worker_scope.cjs --self-test
          node tools/check_worker_scope.cjs
      # Phase 2 Integration D: independently execute exactly the submitted PR-head case validators.
      # Temporary preflight; convert to main-path checks after individual case PR merges.
      - uses: actions/checkout@v4
        with:
          ref: 6030e2ebf0b64216b290dafbf2158595e94f1c5b
          path: case-checks/pe
          persist-credentials: false
      - name: Independent native Node financial QA — PE (pinned PR SHA)
        run: node case-checks/pe/tests/cases/pe/check-case.cjs
      - uses: actions/checkout@v4
        with:
          ref: a248305533d9c92589c0e62353d265ce84e4d0dc
          path: case-checks/vc
          persist-credentials: false
      - name: Independent native Node financial QA — VC (pinned PR SHA)
        run: node case-checks/vc/tests/cases/vc/check-case.cjs
      - uses: actions/checkout@v4
        with:
          ref: 13c2ebea32a5701d78666f53a1ba5692bd33b0ca
          path: case-checks/consulting
          persist-credentials: false
      - name: Independent native Node financial QA — Consulting (pinned PR SHA)
        run: node case-checks/consulting/tests/cases/consulting/check-case.cjs

      - name: Core Phase 3 task and data integrity
        run: node tests/smoke_core_phase3.cjs
      - name: Phase 2 legacy canvas smoke
        run: node tests/smoke_whiteboards.cjs
      - name: Concept C canvas smoke
        run: node tests/smoke_concept_c.cjs
      - name: Concept C usability regression
        run: node tests/smoke_canvas_ux.cjs
      - name: Sidebar, Shapes, and live typography controls
        run: node tests/smoke_canvas_controls.cjs
      - name: Concept D unified toolbar regression
        run: node tests/smoke_concept_d.cjs
      - name: No-flash canvas stability regression
        run: node tests/smoke_canvas_stability.cjs
      - name: Cloudflare static build
        run: |
          python3 tools/build_cloudflare.py
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/boards.js
          test -s dist/boards.css
          test -s dist/canvas-v3.js
          test -s dist/canvas-v3.css
          test -s dist/concept-d.css
          test -s dist/career.js
          test -s dist/career.css
          test -s dist/career-phase2.js
          test -s dist/career-phase2.css
          test -s dist/career-phase3.js
          test -s dist/career-phase3.css

