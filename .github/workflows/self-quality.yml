name: SELF quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    name: Static app and Concept C smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to diff specialist PR files against base for ownership gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check access.js
          node --check account.js
          node --check user-sync.js
          node --check rooms.js
          node --check motion.js
          node --check self-dnd.js
          node --check today.js
          node --check outreach.js
          node --check tracker.js
          node --check calendar.js
          node --check dossier.js
          node --check career-grid.js
          node --check career-visuals.js
          node --check career-review.js
          node --check career-lesson-loop.js
          node --check career-nextup.js
          node --check data-export.js
          node --check work-tools.js
          node --check studio-recipes.js
          node --check studio-present.js
          node --check capture-parse.js
          node --check palette.js
          node --check boards.js
          node --check canvas-v3.js
          node --check career.js
          node --check career-phase2.js
          node --check career-phase3.js
          node --check career-learning.js
          node --check career-director-review.js
          node --check career-workbook-check.js
          node --check career-worksample.js
          node --check career-teaching.js
          node --check career-analyst-lab.js
          node --check career-vc-analyst-lab.js
          node --check career-vc-waterfall.js
          node --check career-consulting-lab.js
          node --check career-pe-projection.js
          node --check career-pe-sensitivity.js
      - name: Phase 1 render smoke
        run: node tests/smoke_render.cjs
      - name: Account password reset helpers and flows
        run: node tests/smoke_account.cjs
      - name: Account sync plan, allow-list and offline safety
        run: node tests/smoke_user_sync.cjs
      - name: Rooms shell routing, badges and door markup
        run: node tests/smoke_rooms.cjs
      - name: Drag-and-drop engine, landing slots and board markup
        run: node tests/smoke_dnd.cjs
      - name: Today room agenda merge, Three for today and inbox triage
        run: node tests/smoke_today.cjs
      - name: Today Next up and Schedule
        run: node tests/smoke_today_now.cjs
      - name: Capture shorthand parser fixtures
        run: node tests/smoke_capture_parse.cjs
      - name: Command palette ranking, items and markup safety
        run: node tests/smoke_palette.cjs
      - name: Outreach helpers (links, names, nudges, CSV, messages)
        run: node tests/smoke_outreach.cjs
      - name: Tracker helpers
        run: node tests/smoke_tracker.cjs
      - name: Calendar smoke
        run: node tests/smoke_calendar.cjs
      - name: Dossier and Game Day smoke tests
        run: node tests/smoke_dossier.cjs
      - name: Practice grid formula engine fixtures
        run: node tests/smoke_career_grid.cjs
      - name: Lesson Loop v2 content recomputed from the case exhibits
        run: node tests/smoke_lessons_v2.cjs
      - name: Lesson Loop v2, five more lessons recomputed from the exhibits
        run: node tests/smoke_lessons_v2_more.cjs
      - name: Next up picker
        run: node tests/smoke_nextup.cjs
      - name: Review queue spaced recall
        run: node tests/smoke_review.cjs
      - name: Export CSV escaping and backup
        run: node tests/smoke_export.cjs
      - name: Work tools saved views and bulk planning
        run: node tests/smoke_work_tools.cjs
      - name: Studio recipes expansion and layout
        run: node tests/smoke_studio_recipes.cjs
      - name: Studio Walkthrough order, camera and pace
        run: node tests/smoke_studio_present.cjs
      - name: Phase 1 API smoke
        run: node tests/smoke_api.cjs
      - name: Career Phase 1 integration and ownership regression
        run: node tests/smoke_career_phase1.cjs
      - name: Career Phase 2 operations and shared Tasks regression
        run: node tests/smoke_career_phase2.cjs
      - name: Career Phase 3 sourced Radar regression
        run: node tests/smoke_career_phase3.cjs
      - name: Career Prep content and canonical Task regression
        run: node tests/smoke_career_learning.cjs
      - name: Career Prep real XLSX asset verification
        run: node tests/smoke_career_starter_assets.cjs
      - name: Portfolio workbench and professional PDF/PPTX deliverable tests
        run: node tests/smoke_career_portfolio.cjs
      - name: Career Prep Phase 1 teaching quality blueprint and competency contract
        run: node tests/smoke_career_prep_blueprint.cjs
      - name: GptChatMaximize parallel workstream safety contract
        run: node tests/smoke_gpt_chat_maximize.cjs
      - name: GptChatMaximize worker PR path isolation
        run: |
          node tools/check_worker_scope.cjs --self-test
          node tools/check_worker_scope.cjs
      # Case packets are in repository source, not browser-served assets.
      # Run the real financial tests permanently on every PR and main push.
      - name: PE flagship case numerical QA
        run: node tests/cases/pe/check-case.cjs
      - name: VC flagship case numerical QA
        run: node tests/cases/vc/check-case.cjs
      - name: Consulting flagship case numerical QA
        run: node tests/cases/consulting/check-case.cjs
      - name: Phase 2 case contract and sealed reviewer asset checks
        run: node tests/smoke_career_case_phase2.cjs
      - name: Phase 3 guided teaching curriculum and numeric checks
        run: node tests/smoke_career_teaching.cjs
      - name: Phase 4 PE analyst lab linked funding checks
        run: node tests/smoke_career_analyst_lab.cjs
      - name: Phase 4 five-year cash-debt-return case checks
        run: node tests/smoke_pe_projection.cjs
      - name: Phase 4 entry exit sensitivity and maximum bid
        run: node tests/smoke_pe_sensitivity.cjs
      - name: Phase 4 VC underwriting guided calculations
        run: node tests/smoke_vc_analyst_lab.cjs
      - name: VC cap table and exit waterfall math
        run: node tests/smoke_vc_waterfall.cjs
      - name: Consulting analyst profit bridge and initiative scenario
        run: node tests/smoke_consulting_lab.cjs
      - name: Phase 5 Director Review public contract and read-only parity fixtures
        run: |
          node tests/career-director-review.test.cjs
          node --check tools/check_career_production.mjs
          node tests/check_career_production.test.mjs
      - name: Phase 6 Work Sample content, sealed-file leak guard and renderer safety
        run: node tests/smoke_worksample_content.cjs
      - name: Phase 6 deterministic XLSX structure check with deliberately broken workbooks
        run: node tests/smoke_workbook_check.cjs
      - name: Core Phase 3 task and data integrity
        run: node tests/smoke_core_phase3.cjs
      - name: Phase 2 legacy canvas smoke
        run: node tests/smoke_whiteboards.cjs
      - name: Concept C canvas smoke
        run: node tests/smoke_concept_c.cjs
      - name: Concept C usability regression
        run: node tests/smoke_canvas_ux.cjs
      - name: Sidebar, Shapes, and live typography controls
        run: node tests/smoke_canvas_controls.cjs
      - name: Concept D unified toolbar regression
        run: node tests/smoke_concept_d.cjs
      - name: No-flash canvas stability regression
        run: node tests/smoke_canvas_stability.cjs
      - name: Cloudflare static build
        run: |
          python3 tools/build_cloudflare.py
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/rooms.js
          test -s dist/rooms.css
          test -s dist/motion.js
          test -s dist/motion.css
          test -s dist/self-dnd.js
          test -s dist/today.js
          test -s dist/capture-parse.js
          test -s dist/palette.js
          test -s dist/styles.css
          test -s dist/boards.js
          test -s dist/boards.css
          test -s dist/canvas-v3.js
          test -s dist/canvas-v3.css
          test -s dist/concept-d.css
          test -s dist/career.js
          test -s dist/career.css
          test -s dist/career-phase2.js
          test -s dist/career-phase2.css
          test -s dist/career-phase3.js
          test -s dist/career-phase3.css
          test -s dist/career-teaching.js
          test -s dist/career-analyst-lab.js
          test -s dist/career-vc-analyst-lab.js
          test -s dist/career-vc-waterfall.js
          test -s dist/career-consulting-lab.js
          test -s dist/career-director-review.js
          test -s dist/career-workbook-check.js
          test -s dist/career-worksample.js
          test -s dist/content/work-samples/index.json
          test -s dist/content/work-samples/pe/brief.md
          test -s dist/content/work-samples/vc/brief.md
          test -s dist/content/work-samples/vc/holdout-cohorts.csv
          test -s dist/content/work-samples/consulting/brief.md
          test -s dist/content/work-samples/consulting/E06.csv
          test -s dist/content/career-director-review/review-panels.json
          test -s dist/career-pe-projection.js
          test -s dist/career-pe-sensitivity.js
          test -s dist/content/career-teaching.json
          test ! -e dist/content/career-cases
          test ! -e dist/tests
          test ! -e dist/AGENTS.md

