name: SELF Cobalt Council review
on:
  push:
    branches: [design/self-reference-council-20261011]
  pull_request:
    paths: ['tools/**', '.github/workflows/cobalt-review.yml']
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify original source
        run: python3 tools/build_visual.py
      - name: Install isolated review browser
        run: |
          npm install --prefix .review-runtime --no-save playwright@1.62.1
          .review-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Start candidate server
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/self-review-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ -o /dev/null && break; sleep 1; done
      - name: Independent Looker A
        if: always()
        env:
          NODE_PATH: ${{ github.workspace }}/.review-runtime/node_modules
          SELF_REVIEW_URL: http://127.0.0.1:4173
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/reviews/looker_a.cjs
      - name: Independent Looker B
        if: always()
        env:
          NODE_PATH: ${{ github.workspace }}/.review-runtime/node_modules
          SELF_REVIEW_URL: http://127.0.0.1:4173
        run: node tools/reviews/looker_b.cjs
      - name: Workflow QA
        if: always()
        env:
          NODE_PATH: ${{ github.workspace }}/.review-runtime/node_modules
          SELF_REVIEW_URL: http://127.0.0.1:4173
        run: node tools/reviews/qa_b.cjs
      - name: Gate actual reports
        if: always()
        run: node tools/reviews/gate.cjs
      - name: Retain independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-council-evidence
          path: artifacts/
          retention-days: 14
