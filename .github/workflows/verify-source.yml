name: Verify Rey Workspace source
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble HTML from lossless source segments
        run: python3 tools/assemble.py
      - name: Verify required HTML sections
        run: python3 tools/verify_static.py
